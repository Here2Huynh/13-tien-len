name: test

# Test-only CI: runs the suite on every pull request. It never
# deploys — deploys are the foreman's step (tools/deploy/deploy.py).

on:
  pull_request:

jobs:
  npm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
